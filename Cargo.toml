[package]
name = "corvo-lan"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Serverless peer-to-peer chat for your local network"
license = "Apache-2.0"
repository = "https://github.com/Abinsanth/corvo-lan"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
hkdf = "0.13.0"
rand = "0.10.3"
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "=0.11.0"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["full", "test-util"] }

# Argon2id is deliberately slow; unoptimised it makes debug builds and tests crawl.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Smaller downloads for the release binaries.
[profile.release]
strip = true
