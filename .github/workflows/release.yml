# Merging into `release` publishes the version in Cargo.toml as a GitHub
# Release. Pull requests that touch the build, or a manual run on any other
# branch, only build: a dry run that publishes nothing.
name: Release

on:
  push:
    branches: [release]
  pull_request:
    paths: [.github/workflows/release.yml, Cargo.toml, Cargo.lock]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite a published version
        if: github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::v$VERSION is already released. Bump the version in Cargo.toml first."
            exit 1
          fi

  build:
    needs: version
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # The Intel macOS build is cross-compiled and can't run on this runner.
      - if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/corvo-lan --version
      - name: Package
        env:
          NAME: corvo-lan-${{ matrix.target }}
        run: |
          tar -czf "$NAME.tar.gz" -C "target/${{ matrix.target }}/release" corvo-lan
          if command -v sha256sum > /dev/null; then
            sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          else
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: corvo-lan-${{ matrix.target }}.tar.gz*

  publish:
    needs: [version, build]
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
